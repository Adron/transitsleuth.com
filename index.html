---
layout: default
---
{%- for post in paginator.posts %}
  {% include post-card.html post=post %}
{%- endfor %}
<nav class="pager">
  {%- if paginator.next_page %}<a href="{{ paginator.next_page_path | relative_url }}">← Older posts</a>{% endif %}
  <span>Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
  {%- if paginator.previous_page %}<a href="{{ paginator.previous_page_path | relative_url }}">Newer posts →</a>{% endif %}
</nav>

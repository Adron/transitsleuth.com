<article class="card">
  {%- if include.post.image %}
  <a class="card-thumb" href="{{ include.post.url | relative_url }}"><img src="{{ include.post.image | relative_url }}" alt="" loading="lazy"></a>
  {%- endif %}
  <div class="card-body">
    <h2 class="card-title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
    <p class="meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time></p>
    {%- assign summary = include.post.description | default: include.post.excerpt | strip_html | truncatewords: 45 %}
    <p>{{ summary }}</p>
  </div>
</article>

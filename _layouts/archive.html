---
layout: default
---
<h1 class="archive-title">{{ page.title }}</h1>
<p class="meta">{{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %}</p>
<ul class="archive-list">
  {%- for post in page.posts %}
  <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time> <a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
  {%- endfor %}
</ul>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} &raquo; Feed" href="{{ '/feed/' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700,400italic,600italic,700italic%7CRoboto+Condensed:300,400,700,300italic,400italic,700italic&amp;subset=latin,latin-ext&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/fontawesome/font-awesome.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/editor.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class | default: layout.body_class }}">
<div id="page" class="hfeed site container">
  <a class="skip-link screen-reader-text" href="#content">Skip to content</a>
  {% include header.html %}
  <div id="content" class="site-content">
    <div id="primary" class="content-area">
      <main id="main" class="site-main" role="main">
        {{ content }}
      </main>
    </div>
  </div>
  <footer id="colophon" class="site-footer" role="contentinfo">
    <div class="site-info">
      &copy; 2009&ndash;{{ site.time | date: '%Y' }} {{ site.author.name }} &middot; <a href="{{ '/feed/' | relative_url }}">RSS</a>
    </div>
  </footer>
</div>
<script src="{{ '/assets/js/editor.js' | relative_url }}" defer></script>
</body>
</html>
